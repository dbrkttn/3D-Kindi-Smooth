<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Debug Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
  #debug {
    position: fixed;
    top: 10px;
    left: 10px;
    background: black;
    color: lime;
    padding: 10px;
    font-family: monospace;
    z-index: 1000;
  }
</style>
</head>
<body>

<div id="debug">Loading...</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>

<script>
const debug = document.getElementById("debug");
function log(msg) {
  console.log(msg);
  debug.innerHTML += "<br>" + msg;
}

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaaaaaa);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 10000);
camera.position.set(100, 100, 100);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Light
scene.add(new THREE.AmbientLight(0xffffff, 1));

// 🔴 ADD TEST CUBE (VERY IMPORTANT)
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(),
  new THREE.MeshNormalMaterial()
);
scene.add(cube);
log("Cube added");

// Load model
const loader = new THREE.GLTFLoader();

loader.load(
  "./BC-Kindi-3D.glb",
  function (gltf) {
    log("MODEL LOADED ✅");
    scene.add(gltf.scene);
  },
  function (xhr) {
    log("Loading: " + (xhr.loaded / xhr.total * 100).toFixed(1) + "%");
  },
  function (error) {
    log("ERROR ❌ " + error.message);
  }
);

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
